<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Sliced</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1 class="sr-only">Error 404 - Page Not Found</h1>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="800" height="400"></canvas>
            <div class="canvas-hint">Click/Touch & drag to slice!</div>
        </div>
        
        <div class="ui-container">
            <h2>PAGE SLICED BY NINJA!</h2>
            <p>Oops! The page you are looking for was cut into pieces. Click or drag on the screen to slice it yourself!</p>
            <div class="action-buttons">
                <a href="/" class="btn btn-primary">BACK TO HOMEPAGE</a>
                <button id="replayBtn" class="btn btn-secondary">REPLAY ANIMATION</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
